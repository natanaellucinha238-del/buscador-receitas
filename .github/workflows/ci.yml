name: TudoDelicia - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Testes, build, lint e seguranca
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Compilar aplicacao
        run: npm run build

      - name: Analisar codigo
        run: npm run lint

      - name: Auditar dependencias
        run: npm audit
